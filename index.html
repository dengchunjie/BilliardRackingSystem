<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Random Racking System</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0f1019" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link href="https://fonts.cdnfonts.com/css/lemon-milk" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f1019;
      --bg-secondary: #1a1b2e;
      --bg-card: #1e2035;
      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.3);
      --text-primary: #ffffff;
      --text-secondary: #8b8fa3;
      --text-muted: #555770;
      --border-color: #2a2d45;
      --felt-color: #3a4a3a;
      --felt-dark: #2d3a2d;
      --rail-color: #7a7d8e;
      --rail-dark: #55586a;
      --nav-bg: #161828;
      --shuffle-gradient: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      background: var(--bg-primary);
      flex-shrink: 0;
    }

    .header-title {
      font-family: 'LEMON MILK', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ===== Content Area ===== */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 16px;
      overflow: hidden;
      min-height: 0;
    }

    /* ===== Tabs ===== */
    .tabs {
      display: flex;
      background: var(--bg-card);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      width: 100%;
      max-width: 320px;
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      background: transparent;
      color: var(--text-muted);
      text-align: center;
    }

    .tab.active {
      background: var(--accent-blue);
      color: #fff;
      box-shadow: 0 2px 12px var(--accent-blue-glow);
    }

    .tab:not(.active):active {
      background: rgba(255,255,255,0.05);
    }

    /* ===== Position Options ===== */
    .options-section {
      flex-shrink: 0;
      width: 100%;
      max-width: 320px;
      margin-top: 10px;
    }

    .options-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .option-card {
      flex: 1;
      max-width: 96px;
      aspect-ratio: 1;
      padding: 8px;
      background: var(--bg-card);
      border-radius: 12px;
      border: 2px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-card.active {
      border-color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.08);
    }

    .option-card:active {
      transform: scale(0.95);
    }

    .option-card svg {
      width: 100%;
      height: 100%;
    }

    /* ===== Rack Display ===== */
    .rack-area {
      flex: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
      min-height: 0;
    }

    .rack-surface {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.1;
      max-height: 100%;
      background: linear-gradient(180deg, #4a4a4a 0%, #3a3a3a 50%, #454545 100%);
      border-radius: 20px;
      border: 6px solid var(--rail-color);
      box-shadow:
        inset 0 0 40px rgba(0,0,0,0.4),
        0 8px 32px rgba(0,0,0,0.5),
        0 0 0 2px var(--rail-dark);
      overflow: hidden;
    }

    .rack-surface::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .balls-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .balls-wrapper {
      position: relative;
    }

    /* ===== Ball ===== */
    .ball {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      transform: translate(-50%, -50%);
      box-shadow:
        inset -3px -3px 6px rgba(0,0,0,0.5),
        inset 3px 3px 6px rgba(255,255,255,0.25),
        0 4px 10px rgba(0,0,0,0.5);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
      z-index: 10;
    }

    .ball::after {
      content: '';
      position: absolute;
      width: 35%;
      height: 20%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.5) 0%, transparent 100%);
      top: 12%;
      left: 22%;
      border-radius: 50%;
      pointer-events: none;
    }

    .ball.striped {
      overflow: hidden;
    }

    .ball.striped::before {
      content: '';
      position: absolute;
      top: 25%;
      bottom: 25%;
      left: -5%;
      right: -5%;
      background: #fff;
      z-index: 0;
    }

    .ball.striped .ball-number {
      position: relative;
      z-index: 1;
    }

    .ball-number {
      position: relative;
      z-index: 2;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    @keyframes rollIn {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(-180deg);
        opacity: 0;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.15) rotate(10deg);
        opacity: 1;
      }
      75% {
        transform: translate(-50%, -50%) scale(0.95) rotate(-5deg);
      }
      100% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .ball.animate {
      animation: rollIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* ===== Shuffle Button ===== */
    .shuffle-section {
      flex-shrink: 0;
      width: 100%;
      max-width: 320px;
      padding: 8px 0 12px;
    }

    .shuffle-btn {
      width: 100%;
      padding: 15px 24px;
      border: none;
      border-radius: 14px;
      background: var(--shuffle-gradient);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px var(--accent-blue-glow);
      letter-spacing: 0.5px;
    }

    .shuffle-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px var(--accent-blue-glow);
    }

    .shuffle-btn svg {
      width: 20px;
      height: 20px;
    }

    /* ===== Responsive ===== */
    @media (min-width: 768px) {
      .content {
        padding: 16px 24px;
      }
      .rack-area {
        max-width: 480px;
      }
      .tabs, .shuffle-section, .options-section {
        max-width: 360px;
      }
    }

    @media (max-height: 600px) {
      .header { padding: 10px 16px; }
      .content { padding: 4px 12px; }
      .shuffle-section { padding: 4px 0 8px; }
      .shuffle-btn { padding: 12px 20px; }
      .options-section { margin-top: 6px; }
      .option-card { max-width: 80px; padding: 6px; }
    }

    /* ===== Footer ===== */
    .footer {
      flex-shrink: 0;
      text-align: center;
      padding: 6px 16px 10px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Content -->

    <!-- Rack Display -->
    <div class="rack-area">
      <div class="rack-surface" id="rackSurface">

          <div class="balls-wrapper" id="ballsWrapper"></div>
        </div>
      </div>

    <!-- Shuffle Button -->
    <div class="shuffle-section">
      <button class="shuffle-btn" id="shuffleBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>

      </button>

  </div>

  <!-- Footer -->
  <div class="footer">&copy; 2026 Deng Chunjie. All rights reserved.</div>

  <script>
    /* ===== Ball Data ===== */
    const BALL_COLORS = {
      1:  { bg: '#FFD700', text: '#000', stripe: false },
      2:  { bg: '#0066FF', text: '#FFF', stripe: false },
      3:  { bg: '#FF0000', text: '#FFF', stripe: false },
      4:  { bg: '#FF69B4', text: '#FFF', stripe: false },
      5:  { bg: '#FF8C00', text: '#000', stripe: false },
      6:  { bg: '#008B45', text: '#FFF', stripe: false },
      7:  { bg: '#8B1A1A', text: '#FFF', stripe: false },
      8:  { bg: '#111111', text: '#FFF', stripe: false },
      9:  { bg: '#FFD700', text: '#000', stripe: true },
      10: { bg: '#0066FF', text: '#FFF', stripe: true },
    };

    /* ===== State ===== */
    let currentType = 'nine';
    let ballSize = 44;
    let nineBallOption = 'random';   // 'random' | 'sides' | 'bottom'
    let tenBallOption = 'random';    // 'random' | 'outer'

    const tab9 = document.getElementById('tab9');
    const tab10 = document.getElementById('tab10');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const ballsWrapper = document.getElementById('ballsWrapper');
    const rackSurface = document.getElementById('rackSurface');
    const options9 = document.getElementById('options9');
    const options10 = document.getElementById('options10');

    /* ===== Shuffle (Fisher-Yates) ===== */
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /* ===== Generate Ball Order (rule-compliant) ===== */
    /*
     * 9-Ball Diamond positions:
     *     [0]          apex (#1)
     *    [1][2]        row 1
     *   [3][4][5]      row 2 (#9 at 4)
     *    [6][7]        row 3
     *     [8]          bottom
     *
     * 10-Ball Triangle positions:
     *     [0]          apex (#1)
     *    [1][2]        row 1
     *   [3][4][5]      row 2 (#10 at 4)
     *  [6][7][8][9]    row 3
     */
    function generateOrder(type) {
      if (type === 'nine') {
        const result = new Array(9).fill(0);
        result[0] = 1;  // #1 at apex
        result[4] = 9;  // #9 at center

        if (nineBallOption === 'random') {
          // #2 can go anywhere
          const others = [2, 3, 4, 5, 6, 7, 8];
          shuffle(others);
          let oi = 0;
          for (let i = 0; i < 9; i++) {
            if (result[i] === 0) result[i] = others[oi++];
          }
        } else if (nineBallOption === 'sides') {
          // #2 at positions 3 (left), 5 (right), or 8 (bottom)
          const allowed = [3, 5, 8];
          result[allowed[Math.floor(Math.random() * allowed.length)]] = 2;
          const others = [3, 4, 5, 6, 7, 8];
          shuffle(others);
          let oi = 0;
          for (let i = 0; i < 9; i++) {
            if (result[i] === 0) result[i] = others[oi++];
          }
        } else {
          // #2 fixed at bottom (position 8)
          result[8] = 2;
          const others = [3, 4, 5, 6, 7, 8];
          shuffle(others);
          let oi = 0;
          for (let i = 0; i < 9; i++) {
            if (result[i] === 0) result[i] = others[oi++];
          }
        }

        return result;
      } else {
        const result = new Array(10).fill(0);
        result[0] = 1;   // #1 at apex
        result[4] = 10;  // #10 at center

        if (tenBallOption === 'random') {
          // #2 and #3 can go anywhere
          const others = [2, 3, 4, 5, 6, 7, 8, 9];
          shuffle(others);
          let oi = 0;
          for (let i = 0; i < 10; i++) {
            if (result[i] === 0) result[i] = others[oi++];
          }
        } else {
          // #2 and #3 at bottom corners: positions 6 and 9
          const corners = [6, 9];
          shuffle(corners);
          result[corners[0]] = 2;
          result[corners[1]] = 3;
          const others = [4, 5, 6, 7, 8, 9];
          shuffle(others);
          let oi = 0;
          for (let i = 0; i < 10; i++) {
            if (result[i] === 0) result[i] = others[oi++];
          }
        }

        return result;
      }
    }

    /* ===== Calculate Positions (diamond for 9, triangle for 10) ===== */
    function getPositions(type, size) {
      const positions = [];
      const gap = size * 1.08;

      if (type === 'nine') {
        const vGap = gap * 0.87;
        const rows = [
          [0],
          [-0.5, 0.5],
          [-1, 0, 1],
          [-0.5, 0.5],
          [0],
        ];
        rows.forEach((cols, rowIdx) => {
          const y = (rowIdx - 2) * vGap;
          cols.forEach(cx => {
            positions.push({ x: cx * gap, y });
          });
        });
      } else {
        const vGap = gap * 0.87;
        const rows = [
          [0],
          [-0.5, 0.5],
          [-1, 0, 1],
          [-1.5, -0.5, 0.5, 1.5],
        ];
        rows.forEach((cols, rowIdx) => {
          const y = (rowIdx - 1.5) * vGap;
          cols.forEach(cx => {
            positions.push({ x: cx * gap, y });
          });
        });
      }
      return positions;
    }

    /* ===== Compute Ball Size Based on Container ===== */
    function computeBallSize() {
      const rect = rackSurface.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      let size;
      if (currentType === 'nine') {
        size = Math.min(w / 5.5, h / 6.5);
      } else {
        size = Math.min(w / 6.5, h / 6);
      }

      return Math.max(28, Math.min(size, 80));
    }

    /* ===== Create Ball Element ===== */
    function createBall(num, pos, size, delay, isFixed) {
      const info = BALL_COLORS[num];
      const ball = document.createElement('div');
      ball.className = 'ball' + (info.stripe ? ' striped' : '');

      ball.style.width = size + 'px';
      ball.style.height = size + 'px';
      ball.style.left = pos.x + 'px';
      ball.style.top = pos.y + 'px';
      ball.style.background = info.bg;

      if (isFixed) {
        // Fixed balls: show immediately, no animation
        ball.style.opacity = '1';
      } else {
        ball.style.opacity = '0';
      }

      const numberSize = Math.max(size * 0.44, 14);
      const fontSize = Math.max(size * 0.28, 10);

      const numEl = document.createElement('span');
      numEl.className = 'ball-number';
      numEl.textContent = num;
      numEl.style.width = numberSize + 'px';
      numEl.style.height = numberSize + 'px';
      numEl.style.fontSize = fontSize + 'px';
      numEl.style.color = '#000';
      numEl.style.fontWeight = '800';

      ball.appendChild(numEl);

      if (!isFixed) {
        setTimeout(() => {
          ball.classList.add('animate');
        }, delay);
      }

      return ball;
    }

    /* ===== Determine which balls are fixed ===== */
    function getFixedBalls() {
      if (currentType === 'nine') {
        const fixed = new Set([1, 9]);
        if (nineBallOption === 'bottom') {
          fixed.add(2);
        }
        return fixed;
      } else {
        const fixed = new Set([1, 10]);
        return fixed;
      }
    }

    /* ===== Render Rack ===== */
    function renderRack() {
      ballsWrapper.innerHTML = '';

      ballSize = computeBallSize();
      const order = generateOrder(currentType);
      const positions = getPositions(currentType, ballSize);
      const fixedBalls = getFixedBalls();

      let animDelay = 0;
      order.forEach((num, idx) => {
        const isFixed = fixedBalls.has(num);
        const ball = createBall(num, positions[idx], ballSize, isFixed ? 0 : animDelay, isFixed);
        if (!isFixed) {
          animDelay += 40;
        }
        ballsWrapper.appendChild(ball);
      });

      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    /* ===== Tab Switching ===== */
    function setActiveTab(type) {
      currentType = type;
      tab9.classList.toggle('active', type === 'nine');
      tab10.classList.toggle('active', type === 'ten');
      options9.style.display = type === 'nine' ? 'flex' : 'none';
      options10.style.display = type === 'ten' ? 'flex' : 'none';
      renderRack();
    }

    tab9.addEventListener('click', () => setActiveTab('nine'));
    tab10.addEventListener('click', () => setActiveTab('ten'));
    shuffleBtn.addEventListener('click', () => renderRack());

    /* ===== Option Card Switching ===== */
    options9.addEventListener('click', (e) => {
      const card = e.target.closest('.option-card');
      if (!card) return;
      options9.querySelectorAll('.option-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      nineBallOption = card.dataset.option;
      renderRack();
    });

    options10.addEventListener('click', (e) => {
      const card = e.target.closest('.option-card');
      if (!card) return;
      options10.querySelectorAll('.option-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      tenBallOption = card.dataset.option;
      renderRack();
    });

    /* ===== Responsive Resize ===== */
    const ro = new ResizeObserver(() => {
      ballSize = computeBallSize();
      const balls = ballsWrapper.querySelectorAll('.ball');
      if (balls.length === 0) return;

      const positions = getPositions(currentType, ballSize);

      balls.forEach((ball, idx) => {
        if (idx < positions.length) {
          ball.style.width = ballSize + 'px';
          ball.style.height = ballSize + 'px';
          ball.style.left = positions[idx].x + 'px';
          ball.style.top = positions[idx].y + 'px';

          const numEl = ball.querySelector('.ball-number');
          if (numEl) {
            const numberSize = Math.max(ballSize * 0.44, 14);
            const fontSize = Math.max(ballSize * 0.28, 10);
            numEl.style.width = numberSize + 'px';
            numEl.style.height = numberSize + 'px';
            numEl.style.fontSize = fontSize + 'px';
          }
        }
      });
    });
    ro.observe(rackSurface);

    /* ===== Init ===== */
    document.addEventListener('DOMContentLoaded', () => {
      renderRack();
    });

    /* ===== PWA Registration ===== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(() => console.log('SW registered'))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
